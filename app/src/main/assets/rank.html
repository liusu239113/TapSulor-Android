<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>热度榜</title>
<script>
(function(){
  function applyTheme(){
    try{
      var mode=localStorage.getItem('taptap_theme_mode')||'light';
      var accent=localStorage.getItem('taptap_theme_accent')||'cyan';
      var font=localStorage.getItem('taptap_font_family')||'default';
      var d=document.documentElement;
      d.setAttribute('data-theme',mode);
      d.setAttribute('data-accent',accent);
      if(font&&font!=='default') d.setAttribute('data-font',font); else d.removeAttribute('data-font');
      var m=document.querySelector('meta[name=theme-color]');
      if(m){var map={cyan:'#25B6E9',pink:'#FF7FB3',purple:'#8B7CF6',mint:'#36C9A0'};m.setAttribute('content',mode==='dark'?'#141820':(map[accent]||'#25B6E9'));}
    }catch(e){}
  }
  window.__applyTheme=applyTheme;
  applyTheme();
  window.addEventListener('pageshow', applyTheme);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) applyTheme(); });
})();
</script>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/pixelforge.css">

</head>
<body class="rank-page">
<div class="app">
  <div class="rank-toolbar"><div class="rank-boards" id="boards">
    <button class="rank-board is-active" data-board="hot">热门榜</button>
    <button class="rank-board" data-board="new">新品榜</button>
    <button class="rank-board" data-board="game_jam">聚光灯榜</button>
    <button class="rank-board" data-board="maker">TapTap制造</button>
    <button class="rank-board" data-board="summary">汇总</button>
  </div><div class="rank-meta"><span id="updated">尚未加载</span><button class="rank-refresh" id="refresh">刷新</button></div></div>
  <div class="rank-search"><input id="q" placeholder="搜索榜单内游戏（名称或 APP ID）"><button id="qbtn">搜索</button></div>
  <div class="rank-tags" id="tags"></div>
  <div class="rank-hint" id="hint"></div>
  <div class="rank-list" id="list"><div class="empty">榜单加载中…</div></div>
  <script src="android-bridge.js"></script>
  <script src="js/rank-page.js"></script>
</div></body>
</html>

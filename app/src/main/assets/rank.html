<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>热度榜</title>

<script src="js/theme-sync.js"></script>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/pixelforge.css">

</head>
<body class="rank-page">
<div class="app">
  <div class="rank-toolbar"><div class="rank-boards" id="boards">
    <button class="rank-board is-active" data-board="hot">热门</button>
    <button class="rank-board" data-board="new">新品</button>
    <button class="rank-board" data-board="today">今日</button>
    <button class="rank-board" data-board="game_jam">聚光灯</button>
    <button class="rank-board" data-board="maker">制造</button>
    <button class="rank-board" data-board="summary">汇总</button>
  </div><div class="rank-meta"><span id="updated">尚未加载</span><button class="rank-refresh" id="refresh">刷新</button></div></div>
  <div class="rank-search"><input id="q" placeholder="搜索榜单内游戏（名称或 APP ID）"><button id="qbtn" class="rank-search-btn">搜索</button></div>
  <div class="rank-tags" id="tags"></div>
  <div class="rank-periods" id="periods">
    <button class="rank-period" data-p="h1">1小时</button>
    <button class="rank-period is-active" data-p="day">今日</button>
    <button class="rank-period" data-p="week">本周</button>
  </div>
  <div class="rank-hint" id="hint"></div>
  <div class="rank-list" id="list"><div class="empty">榜单加载中…</div></div>
  <div class="rank-scroll-btns" id="scroll-btns">
    <button class="rank-scroll-btn" id="to-top" aria-label="回到顶部" title="回到顶部">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
    <button class="rank-scroll-btn" id="to-bottom" aria-label="回到底部" title="回到底部">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
    </button>
  </div>
  <script src="android-bridge.js"></script>
  <script src="js/rank-page.js"></script>
</div></body>
</html>
